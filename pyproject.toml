[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aviary-gateway"
version = "0.2.1"
description = "类 magpie 的本地 LLM 网关:协议互转(OpenAI/Anthropic)、路由组、故障切换、用量统计"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aviary = "aviary.cli:main"

[tool.setuptools.packages.find]
include = ["aviary*"]

[tool.ruff]
# 只强制正确性规则;SIM/DTZ/BLE 等风格项按现有代码约定保留
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
