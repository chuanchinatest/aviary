[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aviary-gateway"
version = "0.2.0"
description = "类 magpie 的本地 LLM 网关:协议互转(OpenAI/Anthropic)、路由组、故障切换、用量统计"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[project.scripts]
aviary = "aviary.cli:main"

[tool.setuptools.packages.find]
include = ["aviary*"]
